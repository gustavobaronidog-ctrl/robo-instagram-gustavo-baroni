name: Noticias de IA (le, analisa e enfileira)

on:
  schedule:
    # Geracao antecipada e novas oportunidades de recuperacao antes da primeira noticia (10h30 BRT).
    - cron: "40 9 * * *"    # 06:40 Brasilia
    - cron: "40 10 * * *"   # 07:40 Brasilia
    - cron: "40 11 * * *"   # 08:40 Brasilia
    - cron: "40 12 * * *"   # 09:40 Brasilia
  workflow_dispatch:
    inputs:
      teste:
        description: "true = só testa o modelo, não enfileira nada"
        default: "false"

permissions:
  contents: write
  models: read

concurrency:
  group: noticias-diarias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Garantir fontes e Pillow
        run: |
          sudo apt-get install -y fonts-liberation >/dev/null 2>&1 || true
          python3 -c "import PIL" 2>/dev/null || pip install -q pillow
      - name: Ler noticias, escrever e gerar os posts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TESTE: ${{ github.event.inputs.teste }}
        run: |
          # Falha transitória de Gemini/modelo não pode encerrar a geração do dia.
          for tentativa in 1 2 3; do
            if python3 noticias.py; then
              exit 0
            fi
            if [ "$tentativa" -lt 3 ]; then
              espera=$((tentativa * 90))
              echo "Geração falhou na tentativa $tentativa. Nova tentativa em $espera segundos."
              sleep "$espera"
            fi
          done
          echo "::error::Não foi possível gerar as notícias após 3 tentativas."
          exit 1
      - name: Gravar na fila
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fila_noticias.json noticias_usadas.json imagens
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -q -m "noticias: posts do dia"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break || sleep 5; done
