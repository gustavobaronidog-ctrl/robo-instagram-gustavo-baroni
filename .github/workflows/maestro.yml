name: Maestro dos posts

on:
  schedule:
    # Reserva: se a corrente de plantoes se quebrar, o agendamento religa. Das 7h as 22h (Brasilia).
    - cron: "*/10 10-23 * * *"
    - cron: "*/10 0-1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se o token ja foi configurado
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ -n "$IG_TOKEN" ] || [ -f token.enc ]; then echo "TEM_TOKEN=1" >> "$GITHUB_ENV"; else echo "Sem token ainda: robo em espera (nada sera publicado)."; fi

      - name: Plantao de ~50 min (confere a cada 5 min e publica o atrasado)
        if: env.TEM_TOKEN == '1'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_APP_ID: ${{ vars.IG_APP_ID }}
          IG_REDIRECT: ${{ vars.IG_REDIRECT }}
          IG_USERNAME: gustavobaroni.ai
          IG_USER_ID: "17841478387226769"
        run: |
          git config user.name "robo-gustavo-baroni"
          git config user.email "robo@gustavobaroni.local"
          python3 maestro.py

      - name: Guardar o avanco das filas (garantia extra)
        if: always() && env.TEM_TOKEN == '1'
        run: |
          git config user.name "robo-gustavo-baroni"
          git config user.email "robo@gustavobaroni.local"
          git add estado*.json; git add token.enc 2>/dev/null || true
          git diff --staged --quiet || git commit -m "maestro: avanca as filas"
          git pull --rebase -q || true
          git push || true

      - name: Ligar a proxima rodada (so entre 7h e 22h de Brasilia)
        if: always() && env.TEM_TOKEN == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=America/Sao_Paulo date +%H)
          if [ "$H" -ge 7 ] && [ "$H" -lt 22 ]; then
            gh workflow run maestro.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "Fora do horario (7h-22h): nao liga a proxima rodada."
          fi
